name: Upload Foundry Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with a draft GitHub release
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GMS_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag and draft release
        shell: bash
        run: |
          set -euo pipefail
          GMS_VERSION=$(node -p "require('./module.json').version")
          test "$RELEASE_TAG" = "v$GMS_VERSION"
          test "$(gh release view "$RELEASE_TAG" --repo "$GMS_REPOSITORY" --json isDraft --jq '.isDraft')" = true

      - name: Install development dependencies
        run: npm ci

      - name: Run test suite
        run: bash tests/run-all.sh

      - name: Build and verify reproducible module ZIP
        run: python tools/package-module.py

      - name: Upload assets to draft release
        shell: bash
        run: |
          set -euo pipefail
          GMS_VERSION=$(node -p "require('./module.json').version")
          gh release upload "$RELEASE_TAG" "dist/GMS_Reputation_${GMS_VERSION}.zip" module.json --repo "$GMS_REPOSITORY"
