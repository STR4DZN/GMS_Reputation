name: Package Foundry Module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        shell: bash
        run: bash tests/run-all.sh

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build module ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/GMS_Reputation_${{ steps.version.outputs.version }}.zip" \
            module.json README.md CHANGELOG.md \
            assets docs scripts styles templates \
            -x "*/.DS_Store" "*/Thumbs.db"

      - name: Upload packaged module
        uses: actions/upload-artifact@v4
        with:
          name: GMS_Reputation_${{ steps.version.outputs.version }}
          path: dist/GMS_Reputation_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
